{% extends "base.html" %}
{% block title %}{{ username }} 님의 프로필{% endblock %}
{% block content %}


<h1>{{ username }} 님의 프로필</h1>
{% if posts %}
<h2>글 목록 ({{ posts | length }}개)</h2>
<ul>
{% for p in posts %}
<li>{{ loop.index }}. {{ p }}</li>
{% endfor %}
</ul>
{% else %}
<p>아직 쓴 글이 없습니다.</p>
{% endif %}

{% endblock %}
